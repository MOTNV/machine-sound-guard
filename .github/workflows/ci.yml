# PR마다 바뀐 파트만 검사한다. 브랜치 보호 규칙은 마지막 ci-ok 하나만 필수로 건다.
#   changes : 바뀐 경로로 돌 job을 고른다. 계약·공용 설정이 바뀌거나 main으로 가는 PR이면 전부
#   lint    : ruff (항상, 수 초)
#   device  : ESP32 펌웨어 컴파일 (코어·빌드 캐시) → 가상 ESP32(PC 빌드)가 파이썬 기준 구현과 같은 결과인지 (pytest tests/device)
#   server  : compose 빌드 → 기동(healthcheck) → pytest tests/server tests/contracts
#   tools   : 가상 기계·도구 테스트 (서비스 없이, 수 초)
#   model   : 모델 학습 → 감지율·오경보율 기준 검사, 커밋된 모델 헤더가 학습 결과와 같은지
# 테스트는 tests/<파트>/에 test_*.py 를 넣으면 이 파일을 고치지 않아도 돈다.
name: ci

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      device: ${{ steps.f.outputs.device == 'true' || steps.all.outputs.all == 'true' }}
      server: ${{ steps.f.outputs.server == 'true' || steps.all.outputs.all == 'true' }}
      tools: ${{ steps.f.outputs.tools == 'true' || steps.all.outputs.all == 'true' }}
      model: ${{ steps.f.outputs.model == 'true' || steps.all.outputs.all == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            device:
              - 'device/**'
              - 'tests/device/**'
              - 'model/*.py'                  # 기준 구현이 바뀌면 C 코드와 다시 비교
              - 'tools/virtual_machine.py'
            server:
              - 'server/**'
              - 'tests/server/**'
            tools:
              - 'tools/**'
              - 'tests/tools/**'
            model:
              - 'model/**'
              - 'tests/model/**'
              - 'tools/virtual_machine.py'
              - 'device/firmware/app/src/guard/model_data.h'
            common:
              - 'docs/contracts/**'
              - 'tests/contracts/**'
              - 'tests/conftest.py'
              - 'tests/requirements.txt'
              - 'pytest.ini'
              - '.github/workflows/**'
      - id: all
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] \
             || [ "${{ github.base_ref }}" = "main" ] \
             || [ "${{ steps.f.outputs.common }}" = "true" ]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          else
            echo "all=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pipx run --spec ruff==0.8.6 ruff check .

  device:
    needs: changes
    if: needs.changes.outputs.device == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # device/README.md 환경 표와 같은 값 (XIAO ESP32S3 Sense: 카메라·마이크는 PSRAM을 OPI로 켜야 동작)
      FQBN: esp32:esp32:XIAO_ESP32S3:PSRAM=opi
      ESP32_CORE: "3.3.12"
      ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    steps:
      - uses: actions/checkout@v4
      - name: 코어·빌드 캐시 (모델 zip이 그대로면 모델 컴파일 결과 재사용)
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/.cache/arduino
          key: arduino-${{ env.ESP32_CORE }}-${{ hashFiles('device/model/*.zip') }}
          restore-keys: arduino-${{ env.ESP32_CORE }}-
      - uses: arduino/setup-arduino-cli@v2
      - name: esp32 코어
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core list | grep -q "esp32:esp32 *$ESP32_CORE" \
            || arduino-cli core install "esp32:esp32@$ESP32_CORE" --additional-urls "$ESP32_INDEX"
      - name: Edge Impulse 라이브러리 (device/model/*.zip)
        run: |
          mkdir -p ~/Arduino/libraries
          for z in device/model/*.zip; do
            [ -e "$z" ] || { echo "모델 zip 없음"; break; }
            unzip -q -o "$z" -d ~/Arduino/libraries
          done
      - run: cp device/firmware/app/secrets.example.h device/firmware/app/secrets.h
      - name: 컴파일 (업로드는 각자 PC에서)
        run: arduino-cli compile --fqbn "$FQBN" --warnings default device/firmware/app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt -r tests/requirements.txt
      - name: 가상 ESP32 빌드와 파이썬 기준 구현 비교
        run: pytest tests/device

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 기동 (healthcheck 통과까지)
        working-directory: server
        run: |
          cp ../.env.example .env
          docker compose up -d --build --wait --wait-timeout 120
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - name: pytest (테스트가 0개면 통과)
        run: pytest tests/server tests/contracts || [ $? -eq 5 ]
      - name: 실패하면 로그
        if: failure()
        working-directory: server
        run: docker compose ps && docker compose logs --no-color --tail 200

  tools:
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/requirements.txt
            tests/requirements.txt
      - run: pip install -r tools/requirements.txt -r tests/requirements.txt
      - run: pytest tests/tools

  model:
    needs: changes
    if: needs.changes.outputs.model == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/requirements.txt
            tests/requirements.txt
      - run: pip install -r tools/requirements.txt -r tests/requirements.txt
      - name: 학습·품질 검사 (기준을 못 넘으면 실패)
        run: pytest tests/model

  ci-ok:
    if: always()
    needs: [changes, lint, device, server, tools, model]
    runs-on: ubuntu-24.04
    steps:
      - name: 실패·취소된 job이 없으면 통과 (건너뛴 job은 통과로 본다)
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs.*.result) }}' | grep -qE '"(failure|cancelled)"'; then exit 1; fi
